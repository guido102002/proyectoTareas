<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecTask | Planificador de Tareas de Ciberseguridad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header border-bottom">
    <div class="container py-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div>
        <h1 class="h4 mb-0 brand">&gt;_ GFMI <span class="text-secondary fs-6">Planificador de Tareas</span></h1>
        <small class="text-secondary">Organiza tu trabajo en ciberseguridad</small>
      </div>
      <div class="d-flex flex-wrap gap-2" aria-live="polite">
        <span class="badge text-bg-secondary">Total: <span id="countTotal">0</span></span>
        <span class="badge text-bg-warning">Pendientes: <span id="countPending">0</span></span>
        <span class="badge text-bg-info">En proceso: <span id="countProgress">0</span></span>
        <span class="badge text-bg-success">Finalizadas: <span id="countDone">0</span></span>
      </div>
    </div>
  </header>

  <main class="container my-4">
    <div class="row g-4">

      <!-- FORMULARIO -->
      <section class="col-12 col-lg-5">
        <div class="card panel">
          <div class="card-header fw-semibold">[ Nueva tarea ]</div>
          <div class="card-body">
            <form id="taskForm" novalidate>

              <!-- Alerta de errores (oculta al inicio) -->
              <div id="formAlert" class="alert alert-danger d-none" role="alert">
                <strong id="formAlertTitle"></strong>
                <ul id="formAlertList" class="mb-0 mt-2 ps-3"></ul>
              </div>

              <div class="mb-3">
                <label for="title" class="form-label">Nombre de la tarea *</label>
                <input type="text" id="title" class="form-control" maxlength="80" placeholder="Ej: Escaneo de vulnerabilidades en servidor web">
                <div class="invalid-feedback" id="titleError"></div>
              </div>

              <div class="mb-3">
                <label for="description" class="form-label">Descripción *</label>
                <textarea id="description" class="form-control" rows="3" maxlength="250" placeholder="Alcance, herramientas, hallazgos esperados..."></textarea>
                <div class="invalid-feedback" id="descriptionError"></div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6">
                  <label for="category" class="form-label">Área *</label>
                  <select id="category" class="form-select">
                    <option value="">Selecciona...</option>
                    <option>Pentesting / Red Team</option>
                    <option>Blue Team / SOC</option>
                    <option>Análisis forense / DFIR</option>
                    <option>Análisis de malware</option>
                    <option>Threat Intelligence</option>
                    <option>AppSec / DevSecOps</option>
                    <option>Seguridad en la nube</option>
                    <option>GRC / Cumplimiento</option>
                    <option>Otra</option>
                  </select>
                  <div class="invalid-feedback" id="categoryError"></div>
                </div>
                <div class="col-12 col-sm-6">
                  <label for="priority" class="form-label">Severidad *</label>
                  <select id="priority" class="form-select">
                    <option value="">Selecciona...</option>
                    <option value="critica">Crítica</option>
                    <option value="alta">Alta</option>
                    <option value="media">Media</option>
                    <option value="baja">Baja</option>
                  </select>
                  <div class="invalid-feedback" id="priorityError"></div>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6">
                  <label for="status" class="form-label">Estado *</label>
                  <select id="status" class="form-select">
                    <option value="">Selecciona...</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="en-proceso">En proceso</option>
                    <option value="finalizada">Finalizada</option>
                  </select>
                  <div class="invalid-feedback" id="statusError"></div>
                </div>
                <div class="col-12 col-sm-6">
                  <label for="dueDate" class="form-label">Fecha de entrega *</label>
                  <input type="date" id="dueDate" class="form-control">
                  <div class="invalid-feedback" id="dueDateError"></div>
                </div>
              </div>

              <div class="mb-4">
                <label for="reference" class="form-label">CVE / Ticket (opcional)</label>
                <input type="text" id="reference" class="form-control" placeholder="CVE-2024-12345">
                <div class="invalid-feedback" id="referenceError"></div>
              </div>

              <div class="d-grid d-sm-flex gap-2">
                <button type="submit" class="btn btn-success flex-fill">+ Agregar tarea</button>
                <button type="reset" class="btn btn-outline-secondary" id="btnReset">Limpiar</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- LISTA DE TAREAS -->
      <section class="col-12 col-lg-7">
        <div class="card panel">
          <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="fw-semibold">[ Lista de tareas ]</span>
            <select id="filter" class="form-select form-select-sm w-auto" aria-label="Filtrar tareas por estado">
              <option value="todas">Todas</option>
              <option value="pendiente">Pendientes</option>
              <option value="en-proceso">En proceso</option>
              <option value="finalizada">Finalizadas</option>
            </select>
          </div>
          <div class="card-body">
            <div id="taskList" class="d-grid gap-3"></div>
            <p id="emptyState" class="text-center text-secondary my-4">
              No hay tareas todavía. Registra la primera desde el formulario.
            </p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="text-center text-secondary small py-4">
    Administrador de tareas · Final · Guido Fernando Majin Ibarra · 
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
